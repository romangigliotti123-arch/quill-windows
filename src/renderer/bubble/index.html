<meta charset="utf-8">
<title>Quill</title>
<link rel="stylesheet" href="./bubble.css">
<body>
  <!--
    A quick note: dictating straight from the bar with no window involved. This
    is the one window of Quill's that takes keyboard focus, because for a note
    the destination genuinely IS Quill itself — the words have to land in this
    textarea, through the same path as dictating into any other app.
  -->
  <textarea id="text" spellcheck="true" aria-label="New note" autofocus></textarea>
  <script src="./bubble.js"></script>
</body>
