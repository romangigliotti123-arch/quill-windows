name: CI

# Proves the Windows build on a real Windows machine, every push: type-check,
# the test suite, the bundle, and a full unsigned installer build. The tests
# have no Electron dependency so they also run on Linux, which is a cheap second
# opinion on anything accidentally Windows-specific in the core.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The installer and the portable exe, unsigned. If this passes, the
      # artefact in the next step is what a user gets.
      - run: npm run dist:win
      - name: Show what was built
        shell: pwsh
        run: Get-ChildItem release -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
      - uses: actions/upload-artifact@v4
        with:
          name: quill-windows
          path: |
            release/*.exe
            !release/*unpacked*
          if-no-files-found: error

  core-on-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
